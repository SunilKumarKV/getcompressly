services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: getcompressly
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/getcompressly?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-with-a-strong-32-byte-production-secret
      COOKIE_SECRET: replace-with-a-strong-32-byte-cookie-secret
      CORS_ORIGIN: http://localhost:5173
      STORAGE_PROVIDER: local
      UPLOAD_DIR: uploads
      TRUST_PROXY: 1
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/backend/uploads

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/getcompressly?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-with-a-strong-32-byte-production-secret
      COOKIE_SECRET: replace-with-a-strong-32-byte-cookie-secret
      STORAGE_PROVIDER: local
      UPLOAD_DIR: uploads
    depends_on:
      - postgres
      - redis
    volumes:
      - uploads:/app/backend/uploads

volumes:
  postgres-data:
  uploads:
